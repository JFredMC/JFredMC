<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Jhon Maquilon — Full Stack Developer Semi Senior</title>
  <desc id="d">Banner: Full Stack Developer Semi Senior · Angular · NestJS · Rails · PostgreSQL</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1023"/>
      <stop offset="0.55" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#00d4b4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00d4b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e0c0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c2ff"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00c2a8" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
      .node { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; } .n5 { animation-delay: 2.4s; }
      .flow { stroke-dasharray: 6 10; animation: dash 2.5s linear infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>

  <!-- faint code lines (left/back) -->
  <g class="mono" font-size="13" fill="#8b93c9" fill-opacity="0.16">
    <text x="760" y="40">@Controller('payments')</text>
    <text x="760" y="372">SELECT * FROM transactions WHERE status = 'OK';</text>
    <text x="40" y="375">ng build --configuration production</text>
  </g>

  <!-- network (right side) -->
  <g stroke="url(#accent)" stroke-width="1.6" fill="none" stroke-opacity="0.7">
    <path class="flow" d="M845 110 L955 70 L1080 120 L1140 220 L1050 310 L920 300 L845 110"/>
    <path class="flow" d="M955 70 L990 200 L1080 120 M990 200 L1140 220 M990 200 L1050 310 M990 200 L920 300 M990 200 L845 110"/>
  </g>
  <g fill="#00e0c0">
    <circle class="node" cx="845" cy="110" r="5"/>
    <circle class="node n2" cx="955" cy="70" r="4.5" fill="#7c5cff"/>
    <circle class="node n3" cx="1080" cy="120" r="5"/>
    <circle class="node n4" cx="1140" cy="220" r="4.5" fill="#7c5cff"/>
    <circle class="node n5" cx="1050" cy="310" r="5"/>
    <circle class="node n2" cx="920" cy="300" r="4.5" fill="#7c5cff"/>
  </g>

  <!-- shield (center of network) -->
  <g class="float">
    <circle cx="990" cy="200" r="62" fill="#0b1023" fill-opacity="0.85" stroke="url(#accent)" stroke-width="2"/>
    <path d="M990 158 L1022 170 L1022 198 C1022 220 1008 236 990 244 C972 236 958 220 958 198 L958 170 Z" fill="url(#shieldGrad)"/>
    <path d="M975 200 L986 212 L1007 188" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- payment card motif -->
  <g transform="translate(1062 252) rotate(-8)" opacity="0.9">
    <rect width="104" height="64" rx="9" fill="#151d44" stroke="#7c5cff" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="12" y="14" width="20" height="15" rx="3" fill="#f5c46b" fill-opacity="0.85"/>
    <rect x="12" y="40" width="54" height="5" rx="2.5" fill="#8b93c9" fill-opacity="0.6"/>
    <rect x="72" y="40" width="20" height="5" rx="2.5" fill="#8b93c9" fill-opacity="0.6"/>
  </g>

  <!-- code bracket motif -->
  <g class="mono" font-size="34" font-weight="700" fill="#00e0c0" fill-opacity="0.85">
    <text x="842" y="232">&lt;/&gt;</text>
  </g>

  <!-- left content -->
  <g class="mono" font-size="17" fill="#00e0c0">
    <text x="70" y="108">&gt; hola_mundo<tspan class="cursor">_</tspan></text>
  </g>
  <text class="f" x="68" y="182" font-size="68" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Jhon Maquilon</text>
  <rect x="70" y="204" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text class="f" x="70" y="248" font-size="27" font-weight="600" fill="#e6e8ff">Full Stack Developer Semi Senior</text>

  <!-- tech chips: Angular · NestJS · Rails · PostgreSQL -->
  <g class="f" font-size="16" font-weight="600" text-anchor="middle">
    <rect x="70" y="276" width="104" height="34" rx="17" fill="#dd0031" fill-opacity="0.16" stroke="#dd0031" stroke-opacity="0.8"/>
    <text x="122" y="298" fill="#ff8aa0">Angular</text>
    <text x="186" y="298" fill="#5c6499">·</text>
    <rect x="198" y="276" width="100" height="34" rx="17" fill="#e0234e" fill-opacity="0.14" stroke="#ea2845" stroke-opacity="0.8"/>
    <text x="248" y="298" fill="#ff9aae">NestJS</text>
    <text x="310" y="298" fill="#5c6499">·</text>
    <rect x="322" y="276" width="86" height="34" rx="17" fill="#cc0000" fill-opacity="0.14" stroke="#ff4d4d" stroke-opacity="0.75"/>
    <text x="365" y="298" fill="#ffa3a3">Rails</text>
    <text x="420" y="298" fill="#5c6499">·</text>
    <rect x="432" y="276" width="132" height="34" rx="17" fill="#336791" fill-opacity="0.25" stroke="#5b9bd5" stroke-opacity="0.85"/>
    <text x="498" y="298" fill="#a9d1ff">PostgreSQL</text>
  </g>

  <g fill="#8b93c9">
    <path d="M76 330 a6 6 0 0 1 12 0 c0 5 -6 11 -6 11 s-6 -6 -6 -11 z" fill="none" stroke="#00e0c0" stroke-width="1.8"/>
    <circle cx="82" cy="330" r="2" fill="#00e0c0"/>
    <text class="f" x="96" y="345" font-size="15">Turbo, Antioquia · Colombia</text>
  </g>
</svg>
